# Apache site for the BookTrack demo container. ${PORT} comes from the environment (Render sets it).
<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html
    # Render terminates TLS and overwrites this header at its edge. Do not reuse this
    # trust rule on a publicly exposed origin without a trusted reverse proxy.
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on
    <Directory /var/www/html>
        AllowOverride All
        Require all granted
    </Directory>
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
